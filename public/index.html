<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Technical Service — заявки</title>
	<style>
		body { font-family: sans-serif; margin: 2rem; }
		table { border-collapse: collapse; margin-top: 1rem; width: 100%; max-width: 900px; }
		th, td { border: 1px solid #ccc; padding: 0.5rem 1rem; text-align: left; }
		th { background: #f0f0f0; }
		form { display: grid; gap: 0.5rem; max-width: 320px; margin-top: 1rem; }
		#filtersForm { display: flex; flex-direction: row; align-items: center; max-width: none; }
		#error { color: #b00020; margin-top: 0.5rem; min-height: 1.2rem; }
	</style>
</head>
<body>
	<h1>Заявки на обслуживание</h1>

	<form id="filtersForm">
		<select name="status">
			<option value="">Статус: любой</option>
			<option value="new">new</option>
			<option value="in_progress">in_progress</option>
			<option value="done">done</option>
			<option value="rejected">rejected</option>
		</select>
		<select name="priority">
			<option value="">Приоритет: любой</option>
			<option value="low">low</option>
			<option value="medium">medium</option>
			<option value="high">high</option>
			<option value="critical">critical</option>
		</select>
		<input name="equipmentId" placeholder="ID оборудования">
		<button type="submit">Применить фильтры</button>
	</form>

	<table>
		<thead>
			<tr>
				<th>Название</th>
				<th>Оборудование</th>
				<th>Приоритет</th>
				<th>Статус</th>
				<th>Запланировано</th>
			</tr>
		</thead>
		<tbody id="requestsBody"></tbody>
	</table>

	<h2>Создать заявку</h2>
	<form id="requestForm">
		<input name="equipmentId" placeholder="ID оборудования" required>
		<input name="title" placeholder="Название" required minlength="5" maxlength="120">
		<textarea name="description" placeholder="Описание (необязательно)" maxlength="2000"></textarea>
		<select name="priority" required>
			<option value="low">low</option>
			<option value="medium">medium</option>
			<option value="high">high</option>
			<option value="critical">critical</option>
		</select>
		<input name="plannedAt" type="datetime-local">
		<button type="submit">Создать</button>
	</form>
	<div id="error"></div>

	<script src="/app.js"></script>
</body>
</html>
