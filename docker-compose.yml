name: tech-service

services:
  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=db
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./storage:/app/storage

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"

volumes:
  postgres-data: