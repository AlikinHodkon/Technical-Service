name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: development
          POSTGRES_PASSWORD: development
          POSTGRES_DB: tech-service-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U development -d tech-service-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ненастоящие значения, годятся только для CI-прогона против сервиса
      # postgres выше — реальные секреты сюда никогда не попадают.
      - name: Write CI env file
        run: |
          cat > .env <<'EOF'
          PORT=3000
          NODE_ENV=test
          CORS_ORIGINS=
          RATE_LIMIT_WINDOW_MS=60000
          RATE_LIMIT_MAX=100000
          WEATHER_API_URL=https://api.open-meteo.com/v1
          REQUEST_TIMEOUT_MS=5000
          JWT_ACCESS_SECRET=ci-access-secret
          JWT_REFRESH_SECRET=ci-refresh-secret
          AUTH_RATE_LIMIT_WINDOW_MS=900000
          AUTH_RATE_LIMIT_MAX=25
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER=development
          POSTGRES_PASSWORD=development
          POSTGRES_DB=tech-service-test
          APP_DB_USER=app_user
          APP_DB_PASSWORD=app_user
          GRAFANA_DB_USER=grafana_reader
          GRAFANA_DB_PASSWORD=grafana_reader
          EOF

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tech-service-app:ci
