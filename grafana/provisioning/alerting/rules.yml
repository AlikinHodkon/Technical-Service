apiVersion: 1

groups:
  - orgId: 1
    name: technical-service-alerts
    folder: Alerts
    interval: 1m
    rules:
      - uid: service-down
        title: Service is down
        condition: C
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Приложение недоступно (up == 0) — проверить docker compose ps и логи app"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up{job="app"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }

      - uid: high-5xx-rate
        title: High 5xx error rate
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Доля 5xx выше 5% — смотреть логи nginx/app, искать источник ошибок"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(rate(http_request_duration_seconds_count{status_code=~"5.."}[5m]))
                /
                sum(rate(http_request_duration_seconds_count[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
