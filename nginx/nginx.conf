events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Кэш для /api/reports и /api/sites/*/summary — см. комментарий у location.
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
        max_size=100m inactive=10m use_temp_path=off;

    log_format json_combined escape=json
      '{"time":"$time_iso8601","request_id":"$request_id",'
      '"remote_addr":"$remote_addr","host":"$host","request":"$request",'
      '"status":$status,"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"upstream_response_time":"$upstream_response_time",'
      '"user_agent":"$http_user_agent"}';

    upstream backend {
        # resolve — иначе nginx закэширует IP app при старте и не переживёт его пересоздание (502 до своего рестарта).
        zone backend 64k;
        server app:3000 resolve;
        resolver 127.0.0.11 valid=10s;
        keepalive 32;
        keepalive_timeout 60s;
    }

    # ловим чужие Host/IP (не localhost) и просто обрываем — до приложения не доходит
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        ssl_reject_handshake on;
        return 444;
    }

    server {
        listen 80;
        server_name localhost;
        # 308, не 301 — чтобы POST не превратился в GET при редиректе на https
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        access_log /var/log/nginx/access.log json_combined;
        add_header X-Request-ID $request_id always;

        # Согласовано с express.json({ limit: '100kb' }) + запас на накладные расходы.
        client_max_body_size 200k;
        gzip on;
        gzip_types text/plain application/json application/javascript;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Без proxy_intercept_errors — иначе он перехватит и наши собственные 404/409.
        error_page 502 /_errors/502.json;
        error_page 503 /_errors/503.json;
        error_page 504 /_errors/504.json;
        location ^~ /_errors/ {
            internal;
            alias /etc/nginx/errors/;
            types { }
            default_type application/problem+json;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        # Только тяжёлые read-only отчёты, TTL — сама инвалидация.
        # Ключ включает Authorization — иначе чужой токен получил бы кэш в обход аутентификации.
        location /api/reports/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;

            proxy_cache api_cache;
            proxy_cache_key "$request_method $request_uri $http_authorization";
            proxy_cache_valid 200 30s;
            proxy_cache_lock on;
            proxy_cache_bypass $http_cache_control;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location ~ ^/api/sites/[^/]+/summary$ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;

            proxy_cache api_cache;
            proxy_cache_key "$request_method $request_uri $http_authorization";
            proxy_cache_valid 200 30s;
            proxy_cache_lock on;
            proxy_cache_bypass $http_cache_control;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location /metrics {
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        location /grafana/ {
            auth_basic "Grafana";
            auth_basic_user_file /etc/nginx/auth/htpasswd;
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            return 404 '{"error": "Not Found", "status": 404}';
        }
    }
}
